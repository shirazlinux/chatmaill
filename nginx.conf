worker_processes 1;
error_log /tmp/nginx/error.log warn;
pid /tmp/nginx/nginx.pid;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /tmp/nginx/access.log;
  sendfile on;
  server_tokens off;
  absolute_redirect off;
  port_in_redirect off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json application/ld+json application/xml text/xml text/plain image/svg+xml;

  # Real public host (Paasta's proxy may send X-Forwarded-Host)
  map $http_x_forwarded_host $public_host {
    default $http_x_forwarded_host;
    ""      $host;
  }
  # noindex only on the *.paasta.app alternate address
  map $public_host $robots_tag {
    default        "";
    ~*paasta\.app  "noindex, nofollow";
  }
  map $sent_http_content_type $cache_control {
    default                 "public, max-age=86400";
    ~*text/html             "no-cache";
    ~*^image/               "public, max-age=2592000";
    ~*^font/                "public, max-age=31536000, immutable";
    ~*xml                   "public, max-age=3600";
    ~*text/plain            "public, max-age=3600";
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    add_header Cache-Control $cache_control always;
    add_header X-Robots-Tag $robots_tag always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    # /index.html -> / (uses $request_uri so the internal index lookup does not loop)
    if ($request_uri ~* "^/index\.html(\?.*)?$") {
      return 301 /;
    }

    location = /health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location = /404.html {
      internal;
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
